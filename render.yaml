
services:
  # Backend Service (FastAPI)
  - type: web
    name: backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PYTHON_VERSION
        value: 3.9
      - key: PORT
        value: 8000

  # Frontend Service (React)
  - type: web
    name: frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    rewrites:
      - source: /api/:path*
        destination: http://backend:8000/:path*
